<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="popup/popup.css" />
    </head>
    <body>
        <script src="jobs-table.js"></script>
        <div style="padding: 20px;">
            <h2>All Tracked Jobs</h2>
            <div style="margin-bottom: 10px;">
                <button id="delete-selected">Delete Selected Jobs</button>
            </div>
            <table id="jobs-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Link</th>
                        <th>Date Added</th>
                    </tr>
                </thead>
                <tbody id="jobs-tbody">
                    <!-- Jobs will be populated here -->
                </tbody>
            </table>
        </div>
    </body>
</html>
