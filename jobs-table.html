<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="popup/popup.css" />
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th, td {
                border: 1px solid #ddd;
                padding: 12px;
                text-align: left;
                min-width: 100px;
            }
            th {
                background-color: #f2f2f2;
            }
            tr:hover {
                background-color: #f5f5f5;
            }
            select {
                width: 105%;
                padding: 4px;
            }
            td[contenteditable] {
                min-height: 40px;
            }
        </style>
    </head>
    <body>
        <script src="jobs-table.js"></script>
        <div style="padding: 20px;">
            <h2>All Tracked Jobs</h2>
            <table id="jobs-table">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Date Added</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobs-tbody">
                    <!-- Jobs will be populated here -->
                </tbody>
            </table>
        </div>
    </body>
</html>
